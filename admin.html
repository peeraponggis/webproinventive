<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROINVENTIVE Admin — จัดการเนื้อหาเว็บ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f9fa; --surface: #fff; --border: #e2e4e8; --border-focus: #3b82f6;
  --text: #1a1a1a; --text2: #6b7280; --text3: #9ca3af;
  --accent: #3b82f6; --accent-bg: #eff6ff; --accent-text: #1d4ed8;
  --danger: #ef4444; --danger-bg: #fef2f2;
  --success: #22c55e; --success-bg: #f0fdf4;
  --warn: #f59e0b; --warn-bg: #fffbeb;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.08);
  font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-logo { padding: 0 20px 20px; font-weight: 700; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sidebar-logo img { width: 28px; height: 28px; border-radius: 6px; }
.sidebar nav { padding: 0 8px; }
.sidebar .nav-group { margin-bottom: 4px; }
.sidebar .nav-group-label { padding: 12px 12px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }
.sidebar nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 12px; border: none; background: none; color: var(--text2); font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; text-align: left; }
.sidebar nav button:hover { background: var(--bg); color: var(--text); }
.sidebar nav button.active { background: var(--accent-bg); color: var(--accent-text); }
.sidebar nav button .icon { width: 20px; text-align: center; font-size: 15px; }
.sidebar nav .divider { height: 1px; background: var(--border); margin: 8px 12px; }

.main { flex: 1; padding: 24px 32px; max-width: 960px; }
.main h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.main .subtitle { color: var(--text2); margin-bottom: 24px; font-size: 13px; }

/* Toast */
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transform: translateY(-8px); transition: all .3s; pointer-events: none; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success-bg); color: #166534; border: 1px solid #bbf7d0; }
.toast.error { background: var(--danger-bg); color: #991b1b; border: 1px solid #fecaca; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.hidden-item { opacity: .55; border-style: dashed; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.card-icon { font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 6px; flex-shrink: 0; }
.card-title { font-weight: 600; font-size: 14px; }
.card-desc { font-size: 12px; color: var(--text2); }
.card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }

/* Stat grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-box .num { font-size: 24px; font-weight: 800; }
.stat-box .lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge.visible { background: var(--success-bg); color: #166534; }
.badge.hidden { background: var(--danger-bg); color: #991b1b; }
.badge.internal { background: var(--warn-bg); color: #92400e; }
.badge.external { background: var(--accent-bg); color: var(--accent-text); }

/* Inputs */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.field input, .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--surface); transition: border-color .2s; }
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.field input.url-input { font-family: 'JetBrains Mono', monospace, monospace; font-size: 12px; }
.field .note { font-size: 11px; color: var(--warn); margin-top: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Buttons */
.btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #2563eb; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.toggle-vis { cursor: pointer; user-select: none; }

/* Section header */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.section-head h2 { font-size: 16px; font-weight: 600; }
.section-head .count { font-size: 12px; color: var(--text3); font-weight: 400; margin-left: 8px; }

/* Sub-section header */
.sub-head { font-size: 14px; font-weight: 600; margin: 20px 0 12px; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--text); display: flex; align-items: center; gap: 8px; }

/* Drag handle */
.drag-handle { cursor: grab; color: var(--text3); padding: 4px; font-size: 16px; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.card.dragging { opacity: .4; }
.card.drag-over { border-top: 2px solid var(--accent); }

/* Expand/collapse editor */
.card-editor { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.card-editor.open { display: block; }

/* Preview bar */
.preview-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,.06); transform: translateY(100%); transition: transform .3s; }
.preview-bar.show { transform: translateY(0); }
.preview-bar .changes { font-size: 13px; color: var(--text2); }
.preview-bar .changes strong { color: var(--text); }
.preview-bar .actions { display: flex; gap: 8px; }

/* Add button */
.add-btn { width: 100%; padding: 12px; border: 2px dashed var(--border); border-radius: var(--radius); background: none; color: var(--text2); font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
.add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

/* Delete button */
.btn.delete { color: var(--text3); font-size: 14px; padding: 4px 6px; }
.btn.delete:hover { color: var(--danger); background: var(--danger-bg); }

/* Info box */
.info-box { background: var(--accent-bg); border: 1px solid #bfdbfe; border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--accent-text); margin-bottom: 16px; }
.warn-box { background: var(--warn-bg); border: 1px solid #fde68a; border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: #92400e; margin-bottom: 16px; }

/* Overview page grid */
.page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.page-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all .15s; }
.page-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(59,130,246,.12); }
.page-card .pc-icon { font-size: 24px; margin-bottom: 8px; }
.page-card .pc-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.page-card .pc-desc { font-size: 12px; color: var(--text2); }
.page-card .pc-file { font-size: 11px; color: var(--text3); margin-top: 6px; font-family: monospace; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { padding: 16px; }
  .row { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="img/pilogo.png" alt="" onerror="this.style.display='none'">
      <span>Admin CMS</span>
    </div>
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">หน้าเว็บ</div>
        <button data-section="overview" onclick="showSection('overview')">
          <span class="icon">📋</span> ภาพรวม
        </button>
        <button data-section="page-index" onclick="showSection('page-index')">
          <span class="icon">🏠</span> หน้าแรก
        </button>
        <button data-section="page-product" onclick="showSection('page-product')">
          <span class="icon">📦</span> ผลิตภัณฑ์
        </button>
        <button data-section="page-demo" onclick="showSection('page-demo')">
          <span class="icon">🎬</span> Demo
        </button>
        <button data-section="page-ascs" onclick="showSection('page-ascs')">
          <span class="icon">☀️</span> Solar PV Design
        </button>
        <button data-section="page-platform" onclick="showSection('page-platform')">
          <span class="icon">⚡</span> Energy Platform
        </button>
        <button data-section="page-pitasks" onclick="showSection('page-pitasks')">
          <span class="icon">🗒️</span> Pi Tasks
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">ตั้งค่าทั่วไป</div>
        <button data-section="nav" onclick="showSection('nav')">
          <span class="icon">🧭</span> เมนูและลิงก์
        </button>
        <button data-section="ecosystem" onclick="showSection('ecosystem')">
          <span class="icon">🌐</span> Ecosystem
        </button>
        <button data-section="projects" onclick="showSection('projects')">
          <span class="icon">📊</span> โครงการ
        </button>
        <button data-section="footer" onclick="showSection('footer')">
          <span class="icon">📋</span> Footer
        </button>
        <button data-section="contact" onclick="showSection('contact')">
          <span class="icon">📞</span> ข้อมูลติดต่อ
        </button>
        <button data-section="seo" onclick="showSection('seo')">
          <span class="icon">🔍</span> SEO & AI
        </button>
      </div>
    </nav>
  </aside>

  <main class="main" id="main-content">
    <!-- Rendered by JS -->
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="preview-bar" id="previewBar">
  <div class="changes"><strong id="changeCount">0</strong> การเปลี่ยนแปลง ยังไม่บันทึก</div>
  <div class="actions">
    <button class="btn" onclick="discardChanges()">ยกเลิก</button>
    <button class="btn" onclick="previewChanges()">ดูตัวอย่าง</button>
    <button class="btn primary" onclick="saveChanges()">บันทึก content.json</button>
  </div>
</div>

<script>
var DATA = null;
var ORIGINAL = null;
var changeCount = 0;

/* ── Load ── */
fetch('content.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    ORIGINAL = JSON.stringify(d);
    showSection('overview');
  })
  .catch(function(e){ toast('โหลด content.json ไม่ได้: ' + e.message, 'error'); });

/* ── Sections ── */
function showSection(id){
  document.querySelectorAll('.sidebar nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.section === id);
  });
  var main = document.getElementById('main-content');
  var renderers = {
    'overview': renderOverview,
    'page-index': renderPageIndex,
    'page-product': renderPageProduct,
    'page-demo': renderPageDemo,
    'page-ascs': renderPageAscs,
    'page-platform': renderPagePlatform,
    'page-pitasks': renderPagePiTasks,
    'nav': renderNav,
    'ecosystem': renderEcosystem,
    'projects': renderProjects,
    'footer': renderFooter,
    'contact': renderContact,
    'seo': renderSEO
  };
  if(renderers[id]) renderers[id](main);
}

/* ══════════════════════════════════════════════════
   PAGE RENDERERS — หน้าเว็บ
   ══════════════════════════════════════════════════ */

/* ── Overview ── */
function renderOverview(el){
  var pages = [
    {icon:'🏠', title:'หน้าแรก (index)', desc:'Hero, Donut Chart, ซอฟต์แวร์, เกี่ยวกับเรา, CTA', file:'index.html', section:'page-index'},
    {icon:'📦', title:'ผลิตภัณฑ์ (product)', desc:'Hero, Feature Cards, Portfolio', file:'product.html', section:'page-product'},
    {icon:'🎬', title:'Demo', desc:'Hero, U-Projects Videos, ASC Demo, SaaS Demo', file:'demo.html', section:'page-demo'},
    {icon:'☀️', title:'Solar PV Design (ascs)', desc:'Hero, 3 Cards: Demo, Package, ASC Studio', file:'ascs.html', section:'page-ascs'},
    {icon:'⚡', title:'Energy Platform', desc:'Hero, 3 Cards: PVCAL, Site Survey, SolarMatch', file:'platform.html', section:'page-platform'},
    {icon:'🗒️', title:'Pi Tasks', desc:'Kanban board (JS-driven, ไม่จัดการผ่าน CMS)', file:'pi_tasks/index.html', section:'page-pitasks'}
  ];

  var h = '<h1>Admin CMS — ภาพรวม</h1><p class="subtitle">จัดการเนื้อหาทุกหน้าของเว็บ PROINVENTIVE ผ่าน content.json — คลิกที่การ์ดเพื่อแก้ไข</p>';

  h += '<div class="sub-head">หน้าเว็บทั้งหมด</div>';
  h += '<div class="page-grid">';
  pages.forEach(function(p){
    h += '<div class="page-card" onclick="showSection(\'' + p.section + '\')">' +
      '<div class="pc-icon">' + p.icon + '</div>' +
      '<div class="pc-title">' + esc(p.title) + '</div>' +
      '<div class="pc-desc">' + esc(p.desc) + '</div>' +
      '<div class="pc-file">' + esc(p.file) + '</div>' +
    '</div>';
  });
  h += '</div>';

  var settings = [
    {icon:'🧭', title:'เมนูและลิงก์', desc:'Navbar dropdowns, Quick Links', section:'nav'},
    {icon:'🌐', title:'Ecosystem', desc:'การ์ด Ecosystem บนหน้าแรก', section:'ecosystem'},
    {icon:'📊', title:'โครงการ', desc:'Project Dashboard (' + (DATA.projects ? DATA.projects.length : 0) + ' โครงการ)', section:'projects'},
    {icon:'📋', title:'Footer', desc:'ลิงก์ในส่วนท้ายเว็บ', section:'footer'},
    {icon:'📞', title:'ข้อมูลติดต่อ', desc:'โทร, อีเมล, ที่อยู่, Social', section:'contact'},
    {icon:'🔍', title:'SEO & AI', desc:'Meta tags, Checklist ไฟล์', section:'seo'}
  ];

  h += '<div class="sub-head">ตั้งค่าทั่วไป (ใช้ร่วมทุกหน้า)</div>';
  h += '<div class="page-grid">';
  settings.forEach(function(s){
    h += '<div class="page-card" onclick="showSection(\'' + s.section + '\')">' +
      '<div class="pc-icon">' + s.icon + '</div>' +
      '<div class="pc-title">' + esc(s.title) + '</div>' +
      '<div class="pc-desc">' + esc(s.desc) + '</div>' +
    '</div>';
  });
  h += '</div>';

  h += '<div class="info-box">แก้ไขข้อมูลแล้วกด "บันทึก content.json" ด้านล่าง — ระบบจะดาวน์โหลดไฟล์ให้วางทับใน repo แล้ว commit + push</div>';
  el.innerHTML = h;
}

/* ── หน้าแรก (index.html) ── */
function renderPageIndex(el){
  var pg = DATA.pages && DATA.pages.index ? DATA.pages.index : {};
  var h = '<h1>🏠 หน้าแรก — index.html</h1><p class="subtitle">Hero, Donut Chart, ซอฟต์แวร์ครบวงจร, เกี่ยวกับเรา, CTA</p>';

  /* Hero */
  h += '<div class="sub-head">Hero Section</div>';
  h += '<div class="card">';
  h += '<div class="field"><label>Title</label><input value="' + esc(pg.hero ? pg.hero.title : '') + '" onchange="ensurePath(\'pages.index.hero\');setVal(\'pages.index.hero.title\',this.value)"></div>';
  h += '<div class="row">';
  h += '<div class="field"><label>Badge (ไทย)</label><input value="' + esc(pg.hero && pg.hero.badge ? pg.hero.badge.th : '') + '" onchange="ensurePath(\'pages.index.hero.badge\');setVal(\'pages.index.hero.badge.th\',this.value)"></div>';
  h += '<div class="field"><label>Badge (อังกฤษ)</label><input value="' + esc(pg.hero && pg.hero.badge ? pg.hero.badge.en : '') + '" onchange="ensurePath(\'pages.index.hero.badge\');setVal(\'pages.index.hero.badge.en\',this.value)"></div>';
  h += '</div></div>';

  /* Donut Chart */
  h += '<div class="sub-head">Donut Chart (4 Segments)</div>';
  if(pg.donut){
    pg.donut.forEach(function(d, i){
      h += '<div class="card"><div class="card-head">' +
        '<span class="card-icon" style="background:' + esc(d.color) + '15;font-size:14px">' + (i+1) + '</span>' +
        '<div style="flex:1"><div class="card-title">' + esc(d.label) + '</div><div class="card-desc">' + esc(d.sub) + ' → ' + esc(d.href) + '</div></div>' +
        '<button class="btn sm" onclick="toggleEditor(this)">แก้ไข</button>' +
      '</div>' +
      '<div class="card-editor">' +
        '<div class="row">' +
          '<div class="field"><label>Label</label><input value="' + esc(d.label) + '" onchange="setVal(\'pages.index.donut[' + i + '].label\',this.value)"></div>' +
          '<div class="field"><label>Sub</label><input value="' + esc(d.sub) + '" onchange="setVal(\'pages.index.donut[' + i + '].sub\',this.value)"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>Link (href)</label><input class="url-input" value="' + esc(d.href) + '" onchange="setVal(\'pages.index.donut[' + i + '].href\',this.value)"></div>' +
          '<div class="field"><label>Color</label><input value="' + esc(d.color) + '" onchange="setVal(\'pages.index.donut[' + i + '].color\',this.value)"></div>' +
        '</div>' +
        (d.note ? '<div class="field"><div class="note">' + esc(d.note) + '</div></div>' : '') +
      '</div></div>';
    });
  }

  /* Software Cards */
  h += '<div class="sub-head">ซอฟต์แวร์ครบวงจร (4 Cards)</div>';
  if(pg.softwareCards){
    pg.softwareCards.forEach(function(c, i){
      h += '<div class="card"><div class="card-head">' +
        '<span class="card-icon">' + (c.icon ? '<img src="' + esc(c.icon) + '" style="width:24px;height:24px" onerror="this.textContent=\'📦\'">' : '📦') + '</span>' +
        '<div style="flex:1"><div class="card-title">' + esc(c.title) + '</div><div class="card-desc">' + esc(c.desc ? c.desc.th : '') + '</div></div>' +
        '<button class="btn sm" onclick="toggleEditor(this)">แก้ไข</button>' +
      '</div>' +
      '<div class="card-editor">' +
        '<div class="field"><label>Title</label><input value="' + esc(c.title) + '" onchange="setVal(\'pages.index.softwareCards[' + i + '].title\',this.value)"></div>' +
        '<div class="row">' +
          '<div class="field"><label>คำอธิบาย (ไทย)</label><input value="' + esc(c.desc ? c.desc.th : '') + '" onchange="ensurePath(\'pages.index.softwareCards[' + i + '].desc\');setVal(\'pages.index.softwareCards[' + i + '].desc.th\',this.value)"></div>' +
          '<div class="field"><label>คำอธิบาย (อังกฤษ)</label><input value="' + esc(c.desc ? c.desc.en : '') + '" onchange="ensurePath(\'pages.index.softwareCards[' + i + '].desc\');setVal(\'pages.index.softwareCards[' + i + '].desc.en\',this.value)"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>Icon Path</label><input class="url-input" value="' + esc(c.icon) + '" onchange="setVal(\'pages.index.softwareCards[' + i + '].icon\',this.value)"></div>' +
          '<div class="field"><label>Link (href)</label><input class="url-input" value="' + esc(c.href) + '" onchange="setVal(\'pages.index.softwareCards[' + i + '].href\',this.value)"></div>' +

function renderVideoCard(item, path){
  var title = typeof item.title === 'object' ? item.title.th : item.title;
  var titleEn = typeof item.title === 'object' ? item.title.en : item.title;
  var desc = item.desc ? (typeof item.desc === 'object' ? item.desc.th : item.desc) : '';
  var descEn = item.desc ? (typeof item.desc === 'object' ? item.desc.en : item.desc) : '';
  var isTitleObj = typeof item.title === 'object';

  var h = '<div class="card"><div class="card-head">' +
    '<span class="card-icon">🎥</span>' +
    '<div style="flex:1"><div class="card-title">' + esc(title) + '</div>' +
    '<div class="card-desc">' + esc(item.video || '') + (item.wide ? ' (wide)' : '') + '</div></div>' +
    '<button class="btn sm" onclick="toggleEditor(this)">แก้ไข</button>' +
  '</div>' +
  '<div class="card-editor">';

  if(isTitleObj){
    h += '<div class="row">' +
      '<div class="field"><label>Title (ไทย)</label><input value="' + esc(title) + '" onchange="setVal(\'' + path + '.title.th\',this.value)"></div>' +
      '<div class="field"><label>Title (อังกฤษ)</label><input value="' + esc(titleEn) + '" onchange="setVal(\'' + path + '.title.en\',this.value)"></div>' +
    '</div>';
  } else {
    h += '<div class="field"><label>Title</label><input value="' + esc(title) + '" onchange="setVal(\'' + path + '.title\',this.value)"></div>';
  }

  h += '<div class="row">' +
    '<div class="field"><label>คำอธิบาย (ไทย)</label><textarea onchange="setVal(\'' + path + '.desc.' + (typeof item.desc === 'object' ? 'th' : '') + '\',this.value)">' + esc(desc) + '</textarea></div>' +
    '<div class="field"><label>คำอธิบาย (อังกฤษ)</label><textarea onchange="setVal(\'' + path + '.desc.' + (typeof item.desc === 'object' ? 'en' : '') + '\',this.value)">' + esc(descEn) + '</textarea></div>' +
  '</div>';

  h += '<div class="row">' +
    '<div class="field"><label>Video Path</label><input class="url-input" value="' + esc(item.video || '') + '" onchange="setVal(\'' + path + '.video\',this.value)"></div>' +
    '<div class="field"><label>Poster Image</label><input class="url-input" value="' + esc(item.poster || '') + '" onchange="setVal(\'' + path + '.poster\',this.value)"></div>' +
  '</div>';

  h += '<div class="field"><label>Wide Layout</label><select onchange="setVal(\'' + path + '.wide\',this.value===\'true\')">' +
    '<option value="false"' + (!item.wide ? ' selected' : '') + '>ปกติ</option>' +
    '<option value="true"' + (item.wide ? ' selected' : '') + '>กว้างเต็ม (wide)</option>' +
  '</select></div>';

  h += '</div></div>';
  return h;
}

/* ══════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════ */

function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

function getByPath(obj, path){
  return path.replace(/\[(\d+)\]/g, '.$1').split('.').reduce(function(o, k){ return o && o[k]; }, obj);
}
function setByPath(obj, path, val){
  var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  var last = parts.pop();
  var target = parts.reduce(function(o, k){ return o[k]; }, obj);
  target[last] = val;
}

function ensurePath(path){
  var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  var cur = DATA;
  for(var i = 0; i < parts.length; i++){
    if(cur[parts[i]] === undefined || cur[parts[i]] === null){
      cur[parts[i]] = isNaN(parts[i+1]) ? {} : [];
    }
    cur = cur[parts[i]];
  }
}

function setVal(path, val){
  setByPath(DATA, path, val);
  markChanged();
}

function toggleVis(path){
  var item = getByPath(DATA, path);
  item.visible = !item.visible;
  markChanged();
  showSection(document.querySelector('.sidebar nav button.active').dataset.section);
}

function toggleEditor(btn){
  var editor = btn.closest('.card').querySelector('.card-editor');
  editor.classList.toggle('open');
  btn.textContent = editor.classList.contains('open') ? '✕ ปิด' : 'แก้ไข';
}

function markChanged(){
  changeCount = JSON.stringify(DATA) === ORIGINAL ? 0 : 1;
  document.getElementById('changeCount').textContent = changeCount;
  document.getElementById('previewBar').classList.toggle('show', changeCount > 0);
}

function discardChanges(){
  DATA = JSON.parse(ORIGINAL);
  markChanged();
  showSection(document.querySelector('.sidebar nav button.active').dataset.section);
  toast('ยกเลิกการเปลี่ยนแปลงแล้ว', 'success');
}

function previewChanges(){
  var w = window.open('', '_blank', 'width=600,height=500');
  w.document.write('<html><head><title>Preview changes</title><style>body{font-family:system-ui;padding:20px;font-size:13px}pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap}h2{font-size:16px;margin-bottom:12px}</style></head><body>');
  w.document.write('<h2>content.json ที่จะบันทึก</h2>');
  w.document.write('<pre>' + esc(JSON.stringify(DATA, null, 2)) + '</pre>');
  w.document.write('</body></html>');
  w.document.close();
}

function saveChanges(){
  DATA._updated = new Date().toISOString().slice(0,10);
  var blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'content.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ดาวน์โหลด content.json แล้ว — วางทับไฟล์เดิมใน repo แล้ว commit + push', 'success');
  ORIGINAL = JSON.stringify(DATA);
  markChanged();
}

  var menu = DATA.nav.menus[menuIndex];
  menu.items.push({id:genId('item'), icon:'📄', label:{th:'รายการใหม่',en:'New Item'}, desc:{th:'คำอธิบาย',en:'Description'}, href:'#', visible:false});
  markChanged();
  showSection('nav');
  toast('เพิ่มรายการใหม่ใน ' + menu.label.th + ' แล้ว', 'success');
}

function addQuickLink(){
  DATA.nav.quickLinks.push({id:genId('ql'), label:{th:'ลิงก์ใหม่',en:'New Link'}, href:'#', visible:false});
  markChanged();
  showSection('nav');
  toast('เพิ่ม Quick Link ใหม่แล้ว', 'success');
}

function addEcosystemItem(){
  DATA.ecosystem.push({id:genId('eco'), title:{th:'การ์ดใหม่',en:'New Card'}, desc:{th:'คำอธิบาย',en:'Description'}, href:'#', linkText:{th:'ดูเพิ่ม →',en:'Learn more →'}, visible:false});
  markChanged();
  showSection('ecosystem');
  toast('เพิ่มการ์ด Ecosystem ใหม่แล้ว', 'success');
}

function addProject(){
  if(!DATA.projects) DATA.projects = [];
  DATA.projects.push({id:genId('proj'), name:'โครงการใหม่', kWp:0, type:'designed', province:null, lat:null, lng:null});
  markChanged();
  showSection('projects');
  toast('เพิ่มโครงการใหม่แล้ว', 'success');
}

function deleteProject(idx){
  var name = DATA.projects[idx].name;
  if(!confirm('ลบ "' + name + '" ?')) return;
  DATA.projects.splice(idx, 1);
  markChanged();
  showSection('projects');
  toast('ลบ ' + name + ' แล้ว', 'success');
}

function addFooterItem(){
  DATA.footer.products.push({id:genId('ft'), label:{th:'ลิงก์ใหม่',en:'New Link'}, href:'#', visible:false});
  markChanged();
  showSection('footer');
  toast('เพิ่ม Footer Link ใหม่แล้ว', 'success');
}

function addSeoItem(){
  if(!DATA.seo) DATA.seo = {siteTitle:{th:'',en:''},siteDesc:{th:'',en:''},keywords:'',canonical:'',ogImage:'',items:[]};
  var label = prompt('ชื่อรายการ SEO/AI ใหม่ (เช่น FAQ Schema, AMP Pages):');
  if(!label) return;
  DATA.seo.items.push({id:genId('seo'), label:label, status:'pending', note:''});
  markChanged();
  showSection('seo');
  toast('เพิ่ม ' + label + ' แล้ว', 'success');
}

function deleteSeoItem(idx){
  if(!confirm('ลบ "' + DATA.seo.items[idx].label + '" ?')) return;
  DATA.seo.items.splice(idx, 1);
  markChanged();
  showSection('seo');
  toast('ลบรายการ SEO แล้ว', 'success');
}

function setSeoStatus(idx, val){
  DATA.seo.items[idx].status = val;
  markChanged();
}

function deleteItem(arrPath, idx){
  var arr = getByPath(DATA, arrPath);
  var name = arr[idx].label ? (typeof arr[idx].label === 'object' ? arr[idx].label.th : arr[idx].label) : (arr[idx].title ? (typeof arr[idx].title === 'object' ? arr[idx].title.th : arr[idx].title) : 'รายการนี้');
  if(!confirm('ลบ "' + name + '" ?')) return;
  arr.splice(idx, 1);
  markChanged();
  showSection(document.querySelector('.sidebar nav button.active').dataset.section);
  toast('ลบ ' + name + ' แล้ว', 'success');
}

function toast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success') + ' show';
  setTimeout(function(){ t.classList.remove('show'); }, 4000);
}
</script>
</body>
</html>
